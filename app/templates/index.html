<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Second Brain</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
        }

        /* ── Layout ── */
        header {
            background: #2c3e50;
            color: #fff;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 { font-size: 1.3rem; letter-spacing: 0.5px; }
        header small { font-size: 0.75rem; opacity: 0.6; }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1100px;
            margin: 28px auto;
            padding: 0 20px;
        }

        /* ── Cards ── */
        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 20px;
        }
        .card h2 {
            font-size: 1rem;
            color: #2c3e50;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }

        /* ── Dropzone ── */
        .dropzone {
            border: 2px dashed #3498db;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            color: #3498db;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }
        .dropzone.dragover { background: #ecf6fd; }
        .dropzone span { display: block; margin-top: 6px; font-size: 0.75rem; color: #888; }

        /* ── URL input ── */
        .url-row {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }
        .url-row input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.88rem;
        }

        /* ── Buttons ── */
        button {
            padding: 8px 16px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.88rem;
            transition: background 0.2s;
            white-space: nowrap;
        }
        button:hover { background: #2980b9; }
        button.secondary { background: #7f8c8d; }
        button.secondary:hover { background: #636e72; }

        /* ── Status pill ── */
        #upload-status {
            margin-top: 10px;
            font-size: 0.82rem;
            min-height: 18px;
            color: #27ae60;
        }
        #upload-status.error { color: #e74c3c; }

        /* ── Tabs ── */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }
        .tab-btn {
            padding: 5px 14px;
            border: 1px solid #ddd;
            border-radius: 20px;
            background: #f4f6f8;
            color: #555;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .tab-btn.active {
            background: #2c3e50;
            color: #fff;
            border-color: #2c3e50;
        }

        /* ── File list ── */
        #file-list { list-style: none; }
        #file-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            margin-bottom: 5px;
            background: #f8f9fa;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        #file-list li a { color: #2c3e50; text-decoration: none; flex: 1; }
        #file-list li a:hover { color: #2980b9; text-decoration: underline; }
        .type-badge {
            font-size: 0.7rem;
            padding: 2px 7px;
            border-radius: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .type-pdf   { background: #fdecea; color: #c0392b; }
        .type-image { background: #e8f8f5; color: #1e8449; }
        .type-url   { background: #eaf4fb; color: #1a5276; }
        .type-misc  { background: #f4f6f7; color: #7f8c8d; }

        /* ── Recall / Search ── */
        .search-row {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }
        .search-row input {
            flex: 1;
            padding: 9px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.88rem;
        }

        .filter-row {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        #recall-results { list-style: none; }
        #recall-results li {
            padding: 12px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border-left: 3px solid #3498db;
            border-radius: 0 6px 6px 0;
            font-size: 0.85rem;
        }
        .result-title {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 4px;
        }
        .result-snippet { color: #555; line-height: 1.5; }
        .result-meta {
            margin-top: 6px;
            font-size: 0.75rem;
            color: #888;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .result-score { color: #27ae60; font-weight: bold; }

        /* ── Stats bar ── */
        #stats-bar {
            grid-column: 1 / -1;
            background: #2c3e50;
            color: #ecf0f1;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 0.82rem;
            display: flex;
            gap: 24px;
            align-items: center;
        }
        #stats-bar span { opacity: 0.7; }
        #stats-bar strong { color: #3498db; }

        /* ── Responsive ── */
        @media (max-width: 700px) {
            .layout { grid-template-columns: 1fr; }
            #stats-bar { grid-column: 1; }
        }
    </style>
</head>
<body>

<header>
    <h1>🧠 Second Brain</h1>
    <small id="header-stats">Loading...</small>
</header>

<div class="layout">

    <!-- Stats bar -->
    <div id="stats-bar">
        <span>ChromaDB: <strong id="stat-chunks">—</strong> chunks indexed</span>
        <span>Files stored: <strong id="stat-files">—</strong></span>
    </div>

    <!-- ── Left: Ingest panel ── -->
    <div class="card">
        <h2>📥 Add to Brain</h2>

        <!-- File upload -->
        <div class="dropzone" id="dropzone">
            Drop a PDF or image here, or click to select
            <span>PDFs are auto-indexed after upload</span>
        </div>
        <input type="file" id="file-input" style="display:none" accept=".pdf,.txt,.md,.jpg,.jpeg,.png,.webp">

        <!-- URL ingest -->
        <div class="url-row">
            <input type="text" id="url-input" placeholder="Paste a URL to ingest (article, docs, paper...)">
            <button onclick="ingestUrl()">Save URL</button>
        </div>

        <div id="upload-status"></div>
    </div>

    <!-- ── Right: Recall panel ── -->
    <div class="card">
        <h2>🔍 Recall</h2>

        <div class="search-row">
            <input type="text" id="recall-input" placeholder="What do you want to remember?" onkeydown="if(event.key==='Enter') doRecall()">
            <button onclick="doRecall()">Search</button>
        </div>

        <div class="filter-row">
            <button class="tab-btn active" onclick="setFilter(null, this)">All</button>
            <button class="tab-btn" onclick="setFilter('pdf', this)">Papers</button>
            <button class="tab-btn" onclick="setFilter('url', this)">URLs</button>
            <button class="tab-btn" onclick="setFilter('image', this)">Images</button>
        </div>

        <ul id="recall-results"><li style="color:#aaa;font-size:0.85rem">Search results appear here...</li></ul>
    </div>

    <!-- ── Full width: File browser ── -->
    <div class="card" style="grid-column: 1 / -1;">
        <h2>📂 Files</h2>

        <div class="tabs">
            <button class="tab-btn active" onclick="setTypeFilter('all', this)">All</button>
            <button class="tab-btn" onclick="setTypeFilter('pdf', this)">Papers</button>
            <button class="tab-btn" onclick="setTypeFilter('image', this)">Images</button>
            <button class="tab-btn" onclick="setTypeFilter('url', this)">URLs</button>
            <button class="tab-btn" onclick="setTypeFilter('misc', this)">Misc</button>
        </div>

        <ul id="file-list"></ul>
    </div>

</div>

<script>
    const AUTH = 'Basic ' + btoa('admin:pass');
    let currentTypeFilter = 'all';
    let currentRecallFilter = null;
    let allFiles = [];

    // ── Auth header helper ───────────────────────────────────────────────────
    function authHeaders(extra = {}) {
        return { 'Authorization': AUTH, ...extra };
    }

    // ── Status message ───────────────────────────────────────────────────────
    function setStatus(msg, isError = false) {
        const el = document.getElementById('upload-status');
        el.textContent = msg;
        el.className = isError ? 'error' : '';
    }

    // ── Dropzone ─────────────────────────────────────────────────────────────
    const dropzone  = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', e => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) uploadFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) uploadFile(fileInput.files[0]);
    });

    function uploadFile(file) {
        setStatus(`Uploading ${file.name}...`);
        const formData = new FormData();
        formData.append('file', file);

        fetch('/upload', { method: 'POST', body: formData, headers: authHeaders() })
            .then(res => {
                if (res.ok) {
                    setStatus(`✓ Uploaded & indexing: ${file.name}`);
                    fetchFiles();
                    fetchStats();
                } else {
                    res.json().then(d => setStatus(`✗ ${d.detail || 'Upload failed'}`, true));
                }
            })
            .catch(() => setStatus('✗ Upload error', true));
    }

    // ── URL ingest ───────────────────────────────────────────────────────────
    function ingestUrl() {
        const url = document.getElementById('url-input').value.trim();
        if (!url.startsWith('http')) { setStatus('✗ Enter a valid URL', true); return; }

        setStatus(`Scraping & indexing ${url}...`);

        fetch('/ingest/url', {
            method: 'POST',
            headers: authHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({ url })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'indexed') {
                setStatus(`✓ Indexed: "${data.title}" — ${data.chunks_stored} chunks`);
                document.getElementById('url-input').value = '';
                fetchStats();
                fetchFiles();
            } else {
                setStatus(`✗ ${data.detail || 'Failed'}`, true);
            }
        })
        .catch(() => setStatus('✗ Ingest error', true));
    }

    // ── File list ────────────────────────────────────────────────────────────
    function fetchFiles() {
        fetch('/files', { headers: authHeaders() })
            .then(res => res.json())
            .then(data => {
                allFiles = data.files;
                renderFiles();
                document.getElementById('stat-files').textContent = allFiles.length;
            });
    }

    function setTypeFilter(type, btn) {
        currentTypeFilter = type;
        document.querySelectorAll('.tabs .tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderFiles();
    }

    function renderFiles() {
        const list = document.getElementById('file-list');
        list.innerHTML = '';
        const filtered = currentTypeFilter === 'all'
            ? allFiles
            : allFiles.filter(f => f.type === currentTypeFilter);

        if (filtered.length === 0) {
            list.innerHTML = '<li style="color:#aaa;font-size:0.85rem">No files here yet.</li>';
            return;
        }

        filtered.forEach(f => {
            const li = document.createElement('li');
            li.innerHTML = `
                <span class="type-badge type-${f.type}">${f.type}</span>
                <a href="/download/${encodeURIComponent(f.name)}" target="_blank">${f.name}</a>
            `;
            list.appendChild(li);
        });
    }

    // ── Recall ───────────────────────────────────────────────────────────────
    function setFilter(type, btn) {
        currentRecallFilter = type;
        document.querySelectorAll('.filter-row .tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function doRecall() {
        const query = document.getElementById('recall-input').value.trim();
        if (!query) return;

        const resultsList = document.getElementById('recall-results');
        resultsList.innerHTML = '<li style="color:#aaa">Searching...</li>';

        fetch('/recall', {
            method: 'POST',
            headers: authHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify({ query, n_results: 5, filter_type: currentRecallFilter })
        })
        .then(res => res.json())
        .then(data => {
            resultsList.innerHTML = '';
            if (!data.results || data.results.length === 0) {
                resultsList.innerHTML = '<li style="color:#aaa">No results found.</li>';
                return;
            }
            data.results.forEach(r => {
                const li = document.createElement('li');
                const source = r.source
                    ? `<a href="${r.source}" target="_blank" style="color:#3498db">${r.source.length > 60 ? r.source.slice(0,60)+'…' : r.source}</a>`
                    : '';
                li.innerHTML = `
                    <div class="result-title">${r.title} <span class="type-badge type-${r.file_type}">${r.file_type}</span></div>
                    <div class="result-snippet">${r.snippet}</div>
                    <div class="result-meta">
                        ${source ? '<span>' + source + '</span>' : ''}
                        ${r.tags ? '<span>🏷 ' + r.tags + '</span>' : ''}
                        <span>📅 ${r.date_saved}</span>
                        <span class="result-score">Score: ${r.score}</span>
                    </div>
                `;
                resultsList.appendChild(li);
            });
        })
        .catch(() => {
            resultsList.innerHTML = '<li style="color:#e74c3c">Recall error — is the server running?</li>';
        });
    }

    // ── Stats ────────────────────────────────────────────────────────────────
    function fetchStats() {
        fetch('/brain/stats', { headers: authHeaders() })
            .then(res => res.json())
            .then(data => {
                document.getElementById('stat-chunks').textContent = data.total_chunks;
                document.getElementById('header-stats').textContent =
                    `${data.total_chunks} chunks indexed`;
            })
            .catch(() => {});
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    fetchFiles();
    fetchStats();
    setInterval(fetchFiles, 10000);
    setInterval(fetchStats, 15000);
</script>
</body>
</html>
